<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آلة حاسبة علمية</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --btn: #374151;
      --operator: #f59e0b;
      --equal: #2563eb;
      --func: #0b1220;
      --text: #e5eefb;
      --muted: #9fb3ff;
      --shadow: rgba(0, 0, 0, 0.35);
      --danger: #7f1d1d;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(180deg, #020817 0%, #0b1220 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .calculator {
      width: 430px;
      background: linear-gradient(180deg, var(--panel), #070e19);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 45px var(--shadow);
    }

    .display {
      width: 100%;
      min-height: 70px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-size: 1.6rem;
      text-align: right;
      padding: 16px 14px;
      direction: ltr;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 10px;
      min-height: 52px;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text);
      background: var(--btn);
      transition: transform 0.08s ease, opacity 0.08s ease;
      user-select: none;
    }

    button:active {
      transform: translateY(1px);
    }

    .func {
      background: var(--func);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.04);
      font-size: 0.9rem;
    }

    .operator {
      background: var(--operator);
      color: #111827;
      font-weight: 700;
    }

    .equal {
      background: var(--equal);
      color: white;
      grid-column: 6 / 7;
      grid-row: 4 / 6;
      min-height: 112px;
    }

    .zero {
      grid-column: 1 / 3;
    }

    .clear {
      background: #475569;
      color: white;
    }

    .delete {
      background: var(--danger);
      color: white;
    }

    .note {
      margin-top: 10px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    @media (max-width: 460px) {
      .calculator {
        width: 100%;
      }
      .buttons {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .equal {
        grid-column: auto;
        grid-row: auto;
        min-height: 52px;
      }
      .zero {
        grid-column: 1 / 3;
      }
    }
  </style>
</head>
<body>
  <div class="calculator" role="application" aria-label="آلة حاسبة علمية">
    <input id="display" class="display" type="text" readonly aria-label="شاشة الآلة الحاسبة" />

    <div class="buttons">
      <button class="func" data-fn="sin">sin</button>
      <button class="func" data-fn="cos">cos</button>
      <button class="func" data-fn="tan">tan</button>
      <button class="func" data-fn="asin">asin</button>
      <button class="func" data-fn="acos">acos</button>
      <button class="func" data-fn="atan">atan</button>

      <button class="func" data-fn="log">log</button>
      <button class="func" data-fn="ln">ln</button>
      <button class="func" data-fn="sqrt">√</button>
      <button class="func" data-fn="exp">exp</button>
      <button class="func" data-fn="pow">xʸ</button>
      <button class="func" data-fn="fact">n!</button>

      <button data-val="7">7</button>
      <button data-val="8">8</button>
      <button data-val="9">9</button>
      <button class="operator" data-val="/">÷</button>
      <button class="func" data-fn="pi">π</button>
      <button class="func" data-fn="e">e</button>

      <button data-val="4">4</button>
      <button data-val="5">5</button>
      <button data-val="6">6</button>
      <button class="operator" data-val="*">×</button>
      <button class="operator" data-val="(">(</button>
      <button class="operator" data-val=")">)</button>

      <button data-val="1">1</button>
      <button data-val="2">2</button>
      <button data-val="3">3</button>
      <button class="operator" data-val="-">−</button>
      <button class="clear" data-action="clear">C</button>
      <button class="delete" data-action="delete">DEL</button>

      <button class="zero" data-val="0">0</button>
      <button data-val=".">.</button>
      <button class="operator" data-val="+">+</button>
      <button data-val="%">%</button>
      <button class="equal" data-action="calculate">=</button>
    </div>

    <div class="note">
      دعم لوحة المفاتيح: 0-9، + - * / . ( ) %، Enter = حساب، Esc = مسح، Backspace = حذف
    </div>
  </div>

  <script>
    (() => {
      const display = document.getElementById('display');
      const buttons = Array.from(document.querySelectorAll('button'));
      let current = '';

      function updateDisplay() {
        display.value = current;
      }

      function appendValue(value) {
        if (current.length >= 220) return;
        current += value;
        updateDisplay();
      }

      function clearAll() {
        current = '';
        updateDisplay();
      }

      function deleteLast() {
        current = current.slice(0, -1);
        updateDisplay();
      }

      function factorial(n) {
        const x = Number(n);
        if (!Number.isFinite(x) || x < 0 || !Number.isInteger(x)) return NaN;
        let result = 1;
        for (let i = 2; i <= x; i++) result *= i;
        return result;
      }

      function toRadians(deg) {
        return deg * (Math.PI / 180);
      }

      function tokenize(input) {
        const tokens = [];
        let i = 0;

        while (i < input.length) {
          const ch = input[i];

          if (/\s/.test(ch)) {
            i++;
            continue;
          }

          if (/[0-9.]/.test(ch)) {
            let number = '';
            while (i < input.length && /[0-9.]/.test(input[i])) {
              number += input[i];
              i++;
            }
            tokens.push({ type: 'number', value: Number(number) });
            continue;
          }

          if (/[A-Za-z]/.test(ch)) {
            let name = '';
            while (i < input.length && /[A-Za-z]/.test(input[i])) {
              name += input[i];
              i++;
            }
            const upper = name.toUpperCase();
            const valid = ['SIN', 'COS', 'TAN', 'ASIN', 'ACOS', 'ATAN', 'LOG', 'LN', 'SQRT', 'EXP', 'PI', 'E'];
            if (!valid.includes(upper)) throw new Error('دالة غير معرفة');
            tokens.push({ type: 'func', value: upper });
            continue;
          }

          if ('+-*/^()%'.includes(ch)) {
            tokens.push({ type: 'symbol', value: ch });
            i++;
            continue;
          }

          throw new Error('رمز غير صالح');
        }

        return tokens;
      }

      function precedence(op) {
        const map = { '+': 1, '-': 1, '*': 2, '/': 2, '^': 3 };
        return map[op] ?? 0;
      }

      function isRightAssoc(op) {
        return op === '^';
      }

      function toRPN(tokens) {
        const output = [];
        const stack = [];

        for (let i = 0; i < tokens.length; i++) {
          const token = tokens[i];

          if (token.type === 'number') {
            output.push(token.value);
            continue;
          }

          if (token.type === 'func') {
            stack.push(token.value);
            continue;
          }

          if (token.type === 'symbol') {
            const ch = token.value;

            if (ch === '(') {
              stack.push(ch);
              continue;
            }

            if (ch === ')') {
              while (stack.length && stack[stack.length - 1] !== '(') {
                output.push(stack.pop());
              }
              if (!stack.length) throw new Error('أقواس غير متطابقة');
              stack.pop();
              if (stack.length && ['SIN','COS','TAN','ASIN','ACOS','ATAN','LOG','LN','SQRT','EXP'].includes(stack[stack.length - 1])) {
                output.push(stack.pop());
              }
              continue;
            }

            while (
              stack.length &&
              stack[stack.length - 1] !== '(' &&
              (
                precedence(stack[stack.length - 1]) > precedence(ch) ||
                (precedence(stack[stack.length - 1]) === precedence(ch) && !isRightAssoc(ch))
              )
            ) {
              output.push(stack.pop());
            }

            stack.push(ch);
          }
        }

        while (stack.length) {
          const op = stack.pop();
          if (op === '(') throw new Error('أقواس غير متطابقة');
          output.push(op);
        }

        return output;
      }

      function applyBinaryOperator(a, b, op) {
        switch (op) {
          case '+': return a + b;
          case '-': return a - b;
          case '*': return a * b;
          case '/': return a / b;
          case '^': return Math.pow(a, b);
          case '%': return a * (b / 100);
          default: throw new Error('عامل غير معروف');
        }
      }

      function evaluateRPN(rpn) {
        const stack = [];

        for (const token of rpn) {
          if (typeof token === 'number') {
            stack.push(token);
            continue;
          }

          if (typeof token === 'string') {
            if (token === 'PI') {
              stack.push(Math.PI);
              continue;
            }

            if (token === 'E') {
              stack.push(Math.E);
              continue;
            }

            if (['SIN','COS','TAN','ASIN','ACOS','ATAN','LOG','LN','SQRT','EXP'].includes(token)) {
              const value = stack.pop();
              if (value === undefined) throw new Error('دالة بدون قيمة');

              let result;
              switch (token) {
                case 'SIN': result = Math.sin(toRadians(value)); break;
                case 'COS': result = Math.cos(toRadians(value)); break;
                case 'TAN': result = Math.tan(toRadians(value)); break;
                case 'ASIN': result = (Math.asin(value) * 180) / Math.PI; break;
                case 'ACOS': result = (Math.acos(value) * 180) / Math.PI; break;
                case 'ATAN': result = (Math.atan(value) * 180) / Math.PI; break;
                case 'LOG': result = Math.log10(value); break;
                case 'LN': result = Math.log(value); break;
                case 'SQRT': result = Math.sqrt(value); break;
                case 'EXP': result = Math.exp(value); break;
                default: result = value;
              }

              stack.push(result);
              continue;
            }

            if (token === '!') {
              const value = stack.pop();
              if (value === undefined) throw new Error('عامل غير كامل');
              const result = factorial(value);
              if (!Number.isFinite(result)) throw new Error('خطأ في العامل !');
              stack.push(result);
              continue;
            }

            const b = stack.pop();
            const a = stack.pop();
            if (a === undefined || b === undefined) throw new Error('تعبير غير كامل');
            stack.push(applyBinaryOperator(a, b, token));
          }
        }

        if (stack.length !== 1) throw new Error('تعبير غير صالح');
        return stack[0];
      }

      function normalizeInput(raw) {
        let input = String(raw || '').trim();
        if (!input) return '0';

        input = input.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
        input = input.replace(/π/g, 'PI');
        input = input.replace(/e/g, 'E');
        return input;
      }

      function evaluateExpression(raw) {
        const input = normalizeInput(raw);
        const tokens = tokenize(input);
        const rpn = toRPN(tokens);
        const result = evaluateRPN(rpn);

        if (!Number.isFinite(result)) throw new Error('نتيجة غير محددة');
        return String(result);
      }

      function doCalculate() {
        try {
          current = evaluateExpression(current);
          updateDisplay();
        } catch (error) {
          current = 'خطأ';
          updateDisplay();
          setTimeout(() => {
            if (current === 'خطأ') clearAll();
          }, 900);
        }
      }

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          const value = button.dataset.val;
          const fn = button.dataset.fn;
          const action = button.dataset.action;

          if (value !== undefined) {
            appendValue(value);
            return;
          }

          if (fn !== undefined) {
            if (fn === 'pi') appendValue('PI');
            else if (fn === 'e') appendValue('E');
            else if (fn === 'fact') appendValue('!');
            else if (fn === 'pow') appendValue('^');
            else appendValue(fn.toLowerCase() + '(');
            return;
          }

          if (action === 'clear') {
            clearAll();
          } else if (action === 'delete') {
            deleteLast();
          } else if (action === 'calculate') {
            doCalculate();
          }
        });
      });

      window.addEventListener('keydown', (event) => {
        const key = event.key;

        if (key === 'Enter') {
          event.preventDefault();
          doCalculate();
          return;
        }

        if (key === 'Escape') {
          clearAll();
          return;
        }

        if (key === 'Backspace') {
          deleteLast();
          return;
        }

        if (/^[0-9]$/.test(key) || /^[+\-*/().%^]$/.test(key)) {
          appendValue(key);
          return;
        }

        if (/^[a-zA-Z]$/.test(key)) {
          appendValue(key.toLowerCase() + '(');
        }
      });

      clearAll();
    })();
  </script>
</body>
</html>
