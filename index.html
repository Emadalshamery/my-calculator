<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scientific Calculator — Emadalshamery</title>
  <meta name="description" content="A responsive single-file scientific calculator with keyboard support." />
  <style>
    :root{
      --bg1:#0f172a; --bg2:#071032; --card:#0b1220; --muted:#9fb3ff; --accent:#6366f1; --accent-2:#06b6d4; --op:#f59e0b; --danger:#ef4444; --glass:rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#e6eef8}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

    /* Card */
    .card{width:100%;max-width:520px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:16px;padding:18px;box-shadow:0 20px 50px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}

    /* Display */
    .display{width:100%;height:76px;border-radius:12px;padding:12px 16px;background:transparent;border:1px solid var(--glass);font-size:1.8rem;color:inherit;text-align:right;outline:none;direction:ltr}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:0.9rem}

    /* Buttons grid */
    .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
    button{border:0;border-radius:12px;padding:14px;font-size:1.05rem;background:rgba(255,255,255,0.02);color:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(2,6,23,0.6);transition:transform .06s,opacity .06s}
    button:active{transform:translateY(1px)}

    .btn-fn{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));color:var(--muted);font-weight:600}
    .btn-op{background:var(--op);color:#07101a;font-weight:700}
    .btn-eq{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white;font-weight:700;grid-column:6/7;grid-row:4/6}
    .btn-clear{background:#475569;color:white}
    .btn-del{background:var(--danger);color:white}
    .btn-zero{grid-column:1/3}

    /* Responsive: mobile stacks to 4 columns and larger buttons */
    @media (max-width:520px){
      .card{padding:14px;border-radius:14px}
      .grid{grid-template-columns:repeat(4,1fr);gap:8px}
      .btn-eq{grid-column:auto;grid-row:auto;min-height:56px}
      .btn-zero{grid-column:1/3}
      button{padding:16px;font-size:1.15rem;border-radius:14px}
      .display{height:72px;font-size:1.6rem}
    }

    /* small notes */
    .note{margin-top:12px;color:var(--muted);font-size:0.88rem;text-align:center}

    /* accessibility focus */
    button:focus, .display:focus{outline:3px solid rgba(99,102,241,0.18);outline-offset:2px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="application" aria-label="Scientific calculator">
      <input id="display" class="display" type="text" readonly aria-label="Calculator display" />
      <div class="meta"><div>Scientific • Emadalshamery</div><div>Trig in degrees</div></div>

      <div class="grid" id="buttons">
        <button class="btn-fn" data-fn="sin">sin</button>
        <button class="btn-fn" data-fn="cos">cos</button>
        <button class="btn-fn" data-fn="tan">tan</button>
        <button class="btn-fn" data-fn="asin">asin</button>
        <button class="btn-fn" data-fn="acos">acos</button>
        <button class="btn-fn" data-fn="atan">atan</button>

        <button class="btn-fn" data-fn="ln">ln</button>
        <button class="btn-fn" data-fn="log">log</button>
        <button class="btn-fn" data-fn="sqrt">√</button>
        <button class="btn-fn" data-fn="exp">exp</button>
        <button class="btn-fn" data-fn="pow">xʸ</button>
        <button class="btn-fn" data-fn="fact">n!</button>

        <button data-val="7">7</button>
        <button data-val="8">8</button>
        <button data-val="9">9</button>
        <button class="btn-op" data-val="/">÷</button>
        <button class="btn-fn" data-fn="pi">π</button>
        <button class="btn-fn" data-fn="e">e</button>

        <button data-val="4">4</button>
        <button data-val="5">5</button>
        <button data-val="6">6</button>
        <button class="btn-op" data-val="*">×</button>
        <button class="btn-op" data-val="(">(</button>
        <button class="btn-op" data-val=")">)</button>

        <button data-val="1">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button class="btn-op" data-val="-">−</button>
        <button class="btn-clear" data-action="clear">C</button>
        <button class="btn-del" data-action="delete">DEL</button>

        <button class="btn-zero" data-val="0">0</button>
        <button data-val=".">.</button>
        <button class="btn-op" data-val="+">+</button>
        <button data-val="%">%</button>
        <button class="btn-eq" data-action="calculate">=</button>
      </div>

      <div class="note">Keyboard: numbers, + - * / ( ) . %   Enter = evaluate, Backspace = delete, Esc = clear</div>
    </div>
  </div>

  <script>
  (function(){
    const display = document.getElementById('display');
    const buttons = document.getElementById('buttons');

    const FUNCTIONS = {
      sin: v => Math.sin(v * Math.PI/180), // degrees
      cos: v => Math.cos(v * Math.PI/180),
      tan: v => Math.tan(v * Math.PI/180),
      asin: v => Math.asin(v) * 180/Math.PI,
      acos: v => Math.acos(v) * 180/Math.PI,
      atan: v => Math.atan(v) * 180/Math.PI,
      ln: v => Math.log(v),
      log: v => Math.log10 ? Math.log10(v) : Math.log(v)/Math.LN10,
      sqrt: v => Math.sqrt(v),
      exp: v => Math.exp(v),
      pi: () => Math.PI,
      e: () => Math.E
    };

    const OPERATORS = {
      '+': {prec:2,assoc:'L',fn:(a,b)=>a+b},
      '-': {prec:2,assoc:'L',fn:(a,b)=>a-b},
      '*': {prec:3,assoc:'L',fn:(a,b)=>a*b},
      '/': {prec:3,assoc:'L',fn:(a,b)=>a/b},
      '^': {prec:4,assoc:'R',fn:(a,b)=>Math.pow(a,b)},
      'u-': {prec:5,assoc:'R',fn:(a)=>-a}
    };

    function factorial(n){ n = Math.floor(n); if (n<0) return NaN; if (n<=1) return 1; let r=1; for(let i=2;i<=n;i++) r*=i; return r; }

    function tokenize(s){
      const tokens = []; let i=0;
      const isDigit = ch => /[0-9]/.test(ch);
      const isLetter = ch => /[a-zA-Z]/.test(ch);
      while(i<s.length){
        const ch = s[i];
        if (ch===' '||ch==='\t'){i++;continue}
        if (isDigit(ch) || (ch==='.' && isDigit(s[i+1]))){ let num=ch;i++; while(i<s.length && /[0-9.]/.test(s[i])){num+=s[i++]} tokens.push({type:'num',val:parseFloat(num)}); continue }
        if (isLetter(ch)){ let name=ch;i++; while(i<s.length && /[a-zA-Z0-9_]/.test(s[i])) name+=s[i++]; tokens.push({type:'name',val:name.toLowerCase()}); continue }
        if ('+-*/^'.includes(ch)){ tokens.push({type:'op',val:ch}); i++; continue }
        if (ch==='('||ch===')'){ tokens.push({type:'paren',val:ch}); i++; continue }
        if (ch==='!'){ tokens.push({type:'fact'}); i++; continue }
        if (ch==='%'){ tokens.push({type:'percent'}); i++; continue }
        if (ch===','){ tokens.push({type:'comma'}); i++; continue }
        i++;
      }
      return tokens;
    }

    function toRPN(tokens){
      const out=[]; const stack=[];
      for(let i=0;i<tokens.length;i++){ const t=tokens[i];
        if (t.type==='num') out.push(t);
        else if (t.type==='name'){
          if (t.val in FUNCTIONS) stack.push({type:'func',val:t.val}); else throw new Error('Unknown function: '+t.val);
        } else if (t.type==='fact' || t.type==='percent'){ out.push(t);
        } else if (t.type==='op'){
          let op=t.val; const prev=tokens[i-1]; const prevIsValue = prev && (prev.type==='num' || (prev.type==='paren' && prev.val===')') || prev.type==='fact' || prev.type==='percent');
          if (op==='-' && !prevIsValue) op='u-';
          while(stack.length){ const top=stack[stack.length-1]; if ((top.type==='op' || top.type==='func')){
            const topVal = top.val; const a = OPERATORS[op]||{}; const b = OPERATORS[topVal]||{};
            if ((b && ((a.assoc==='L' && a.prec<=b.prec) || (a.assoc==='R' && a.prec<b.prec))) || top.type==='func'){ out.push(stack.pop()); continue }
          } break }
          stack.push({type:'op',val:op});
        } else if (t.type==='paren'){
          if (t.val==='(') stack.push(t); else { while(stack.length && stack[stack.length-1].type!=='paren') out.push(stack.pop()); if (!stack.length) throw new Error('Mismatched parentheses'); stack.pop(); if (stack.length && stack[stack.length-1].type==='func') out.push(stack.pop()); }
        } else if (t.type==='comma'){ while(stack.length && stack[stack.length-1].type!=='paren') out.push(stack.pop()); if (!stack.length) throw new Error('Unexpected comma'); }
      }
      while(stack.length){ const tk=stack.pop(); if (tk.type==='paren') throw new Error('Mismatched parentheses'); out.push(tk); }
      return out;
    }

    function evalRPN(rpn){
      const st=[];
      for(const t of rpn){
        if (t.type==='num') st.push(t.val);
        else if (t.type==='fact'){ const a=st.pop(); if (a===undefined) throw new Error('Missing operand for !'); st.push(factorial(a)); }
        else if (t.type==='percent'){ const a=st.pop(); if (a===undefined) throw new Error('Missing operand for %'); st.push(a/100); }
        else if (t.type==='op'){
          const op=t.val; if (op==='u-'){ const a=st.pop(); if (a===undefined) throw new Error('Missing operand'); st.push(OPERATORS['u-'].fn(a)); }
          else { const b=st.pop(); const a=st.pop(); if (a===undefined||b===undefined) throw new Error('Incomplete expression'); const fn=OPERATORS[op].fn; st.push(fn(a,b)); }
        } else if (t.type==='func'){ const name=t.val; if (name==='pi'){ st.push(FUNCTIONS['pi']()); continue } if (name==='e'){ st.push(FUNCTIONS['e']()); continue } const a=st.pop(); if (a===undefined) throw new Error('Function missing argument'); const fn=FUNCTIONS[name]; if (!fn) throw new Error('Unknown function'); st.push(fn(a)); }
      }
      if (st.length!==1) throw new Error('Invalid expression'); return st[0];
    }

    function evaluate(expr){ if (!expr||expr.trim()==='') return ''; let s = String(expr).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi'); const tokens = tokenize(s); const rpn = toRPN(tokens); const v = evalRPN(rpn); if (!isFinite(v)) throw new Error('Result not finite'); return String(v); }

    function append(text){ if ((display.value||'').length + String(text).length > 220) return; display.value = (display.value||'') + text }
    function clearAll(){ display.value = '' }
    function backspace(){ display.value = (display.value||'').slice(0,-1) }

    buttons.addEventListener('click', e => { const btn = e.target.closest('button'); if (!btn) return; const val = btn.dataset.val; const fn = btn.dataset.fn; const action = btn.dataset.action; if (val!==undefined) append(val); else if (fn!==undefined){ if (fn==='pi') append('π'); else if (fn==='e') append('e'); else if (fn==='fact') append('!'); else if (fn==='pow') append('^'); else append(fn+'('); } else if (action){ if (action==='clear') clearAll(); else if (action==='delete') backspace(); else if (action==='calculate'){ try{ const res = evaluate(display.value); display.value = res } catch(err){ display.value = 'Error'; setTimeout(()=>{ if (display.value==='Error') clearAll() },900) } } } display.focus(); });

    window.addEventListener('keydown', e => {
      const k = e.key;
      if (k==='Enter'){ e.preventDefault(); try{ display.value = evaluate(display.value) }catch{ display.value='Error'; setTimeout(()=>{ if (display.value==='Error') clearAll() },900) } return }
      if (k==='Backspace'){ backspace(); return }
      if (k==='Escape'){ clearAll(); return }
      if (/^[0-9]$/.test(k) || /^[+\-*/^().%]$/.test(k)) { append(k); return }
      if (/^[a-zA-Z]$/.test(k)) { append(k+'('); return }
    });

    // paste support
    window.addEventListener('paste', e => { const text=(e.clipboardData||window.clipboardData).getData('text'); if (text) { append(text.replace(/\s+/g,'')) } e.preventDefault(); });

    clearAll();
  })();
  </script>
</body>
</html>
